# Decap CMS configuration for GPODH.
#
# Auth: GitHub backend via a self-hosted OAuth handshake (see src/app/api/auth
# and src/app/api/callback). You will need a GitHub OAuth App and two env vars
# in Vercel: GITHUB_OAUTH_CLIENT_ID and GITHUB_OAUTH_CLIENT_SECRET.
#
# NOTE: base_url below is overridden at runtime by public/admin/index.html to
# whatever domain /admin is opened on (gpodh.org, a *.vercel.app URL, or a
# preview), so the OAuth handshake always stays on one origin. The value here is
# just a fallback. Whichever domain you use, the GitHub OAuth App must list
# <that-domain>/api/callback as an Authorization callback URL.

backend:
  name: github
  repo: shubs-me/GPoDH
  branch: master
  base_url: https://gpodh.org
  auth_endpoint: api/auth

# Episode guest photos upload into public/guests and are referenced as /guests/<file>.
media_folder: public/guests
public_folder: /guests

# Review queue: with publish_mode below, hitting "Publish" sends the change
# through Decap's editorial workflow (the "Workflow" tab) — it opens a pull
# request to `master` instead of committing directly, so every edit can be
# reviewed (and an accidental deletion caught) before Vercel deploys it. This
# also guards videos.json against the daily YouTube sync and a CMS save racing
# on the same file: the change arrives as a reviewable PR rather than silently
# overwriting the bot's just-added video. Edit one draft per collection at a
# time (each collection is a single file). Remove this line for direct publish.
publish_mode: editorial_workflow

collections:
  - name: content
    label: Content
    files:
      - name: settings
        label: Site settings
        file: src/data/site/settings.json
        format: json
        description: >-
          Global site details, podcast platform links, social links and the
          consulting call-to-action used across the site.
        fields:
          - name: site
            label: Site details
            widget: object
            fields:
              - { name: name, label: Site name, widget: string }
              - { name: shortName, label: Short name, widget: string }
              - { name: description, label: Description (SEO), widget: text }
              - { name: url, label: Site URL, widget: string }
              - { name: email, label: Contact email, widget: string }
          - name: consulting
            label: Consulting call-to-action
            widget: object
            fields:
              - { name: ctaText, label: Heading, widget: string }
              - { name: ctaLinkText, label: Link text, widget: string }
              - { name: url, label: Link destination, widget: string }
              - { name: description, label: Description, widget: text }
          - name: platforms
            label: Podcast platforms
            widget: object
            fields:
              - { name: apple, label: Apple Podcasts URL, widget: string }
              - { name: spotify, label: Spotify URL, widget: string }
              - { name: youtube, label: YouTube URL, widget: string }
              - { name: rss, label: RSS feed URL, widget: string, required: false }
          - name: social
            label: Social links
            widget: object
            fields:
              - { name: linkedin, label: LinkedIn (personal) URL, widget: string }
              - { name: linkedinCompany, label: LinkedIn (company) URL, widget: string }
              - { name: substack, label: Substack URL, widget: string }
          - name: seo
            label: SEO defaults & list pages
            widget: object
            fields:
              - { name: defaultTitle, label: Default browser-tab title, widget: string }
              - { name: titleTemplate, label: 'Title template (use %s for page name)', widget: string }
              - { name: description, label: Default meta description, widget: text }
              - name: episodes
                label: Episodes page
                widget: object
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: description, label: Meta description, widget: text }
              - name: videos
                label: Videos page
                widget: object
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: description, label: Meta description, widget: text }

      - name: global
        label: Header & footer
        file: src/data/site/global.json
        format: json
        description: >-
          Site-wide navigation and footer text. Social and podcast links live
          in "Site settings".
        fields:
          - { name: topbarText, label: Top bar text, widget: string }
          - { name: subscribeLabel, label: Subscribe button label, widget: string }
          - name: nav
            label: Header navigation
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { name: href, label: 'Link (e.g. /episodes)', widget: string }
              - { name: label, label: Label, widget: string }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: pagesHeading, label: '"Pages" heading', widget: string }
              - name: navLinks
                label: Footer page links
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - { name: href, label: Link, widget: string }
                  - { name: label, label: Label, widget: string }
              - { name: listenHeading, label: '"Listen" heading', widget: string }
              - { name: contactLabel, label: '"Get in touch" label', widget: string }
              - name: socialLabels
                label: Social link labels
                widget: object
                fields:
                  - { name: linkedin, label: LinkedIn (personal) label, widget: string }
                  - { name: linkedinCompany, label: LinkedIn (company) label, widget: string }
                  - { name: substack, label: Substack label, widget: string }
              - { name: copyright, label: Copyright line, widget: string }

      - name: episodes
        label: Episodes
        file: src/data/episodes.json
        format: json
        description: >-
          The podcast episode library. Add a new episode with "Add episodes",
          then drag it to the top of the list so it appears first. Tick
          "Featured" to pin it as the homepage banner.
        fields:
          - name: episodes
            label: Episodes
            label_singular: Episode
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: featured, label: 'Featured (pin as homepage banner)', widget: boolean, required: false, default: false }
              - { name: title, label: Title, widget: string }
              - { name: slug, label: 'Slug (URL, no spaces)', widget: string, hint: 'e.g. my-episode-title — becomes /episodes/my-episode-title' }
              - { name: id, label: 'ID (unique)', widget: string }
              - { name: episodeNumber, label: Episode number, widget: number, required: false, value_type: int }
              - { name: guest, label: Guest, widget: string }
              - { name: guestRole, label: Guest role, widget: string }
              - { name: date, label: 'Date (e.g. Apr 2026)', widget: string }
              - { name: duration, label: 'Duration (e.g. 1hr 8min)', widget: string, required: false }
              - { name: description, label: Description, widget: text }
              - { name: artworkUrl, label: Guest photo, widget: image, required: false, choose_url: true }
              - name: guestFaces
                label: 'Extra guest faces (multi-guest episodes only)'
                widget: list
                required: false
                summary: '{{fields.name}}'
                hint: >-
                  Only for episodes with more than one guest. Add one row per
                  guest (including the first) with their own photo — these
                  individual faces replace the single Guest photo above in the
                  floating face cloud on the Episodes page. Leave empty for
                  single-guest episodes.
                fields:
                  - { name: name, label: Guest name, widget: string }
                  - { name: role, label: 'Job title (shown on the episode page)', widget: string, required: false }
                  - { name: artworkUrl, label: Photo, widget: image, choose_url: true }
                  - { name: artworkPosition, label: 'Photo position (optional, e.g. top center)', widget: string, required: false }
              - { name: splitHeroPhotos, label: 'Show guest photos side by side at the top of the episode page (needs the Extra guest faces list above)', widget: boolean, required: false, default: false }
              - { name: country, label: Country, widget: string }
              - name: themes
                label: Themes
                widget: list
                min: 1
                field: { name: theme, label: Theme, widget: string }
              - name: tags
                label: Tags
                widget: list
                min: 1
                field: { name: tag, label: Tag, widget: string }
              - { name: pullQuote, label: Pull quote, widget: text, required: false }
              - { name: bio, label: Guest bio, widget: text, required: false }
              - name: topics
                label: Key topics
                widget: list
                required: false
                field: { name: topic, label: Topic, widget: text }
              - name: timestamps
                label: Timestamps
                widget: list
                required: false
                fields:
                  - { name: time, label: Time, widget: string }
                  - { name: label, label: Label, widget: string }
              - { name: transcript, label: 'Transcript (included in search)', widget: text, required: false }
              - { name: transistorUrl, label: 'Transistor share URL', widget: string, required: false }
              - { name: spotifyEpisodeId, label: 'Spotify episode ID', widget: string, required: false }
              - { name: youtubeVideoId, label: 'YouTube video ID', widget: string, required: false }
              - { name: audioUrl, label: 'MP3 URL', widget: string, required: false }
              - { name: teaserVideoUrl, label: 'Teaser video URL', widget: string, required: false }
              - { name: guestLinkedIn, label: 'Guest LinkedIn URL', widget: string, required: false }

      - name: videos
        label: Videos
        file: src/data/videos.json
        format: json
        description: >-
          The video library. New uploads go live automatically via the daily
          sync (uncategorised) — use this to add the category and tags, paste a
          transcript (which feeds search), or add a video by hand. Drag an entry
          to the top to feature it, or tick "Featured".
        fields:
          - name: videos
            label: Videos
            label_singular: Video
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: featured, label: 'Featured (pin to top of /videos)', widget: boolean, required: false, default: false }
              - { name: title, label: Title, widget: string }
              - { name: slug, label: 'Slug (URL, no spaces)', widget: string }
              - { name: id, label: 'ID (unique)', widget: string }
              - { name: youtubeVideoId, label: 'YouTube video ID', widget: string }
              - { name: date, label: 'Date (e.g. Mar 2026)', widget: string }
              - name: category
                label: Category
                widget: select
                required: false
                options: ['talk', 'panel', 'explainer', 'clip', 'hot-take']
              - { name: duration, label: 'Duration (e.g. 12:34)', widget: string, required: false }
              - { name: description, label: Description, widget: text }
              - name: tags
                label: Tags
                widget: list
                required: false
                field: { name: tag, label: Tag, widget: string }
              - { name: transcript, label: 'Transcript (included in search)', widget: text, required: false }
              - { name: thumbnailUrl, label: 'Thumbnail override (optional)', widget: image, required: false, choose_url: true }
              - { name: thumbnailPosition, label: 'Thumbnail position (e.g. center 20%)', widget: string, required: false }

      - name: contact
        label: Contact page
        file: src/data/site/contact.json
        format: json
        description: All text on the Contact page.
        fields:
          - { name: eyebrow, label: Eyebrow, widget: string }
          - { name: title, label: Title, widget: string }
          - name: success
            label: Success message (after sending)
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
          - name: form
            label: Form labels
            widget: object
            fields:
              - { name: nameLabel, label: Name label, widget: string }
              - { name: emailLabel, label: Email label, widget: string }
              - { name: organisationLabel, label: Organisation label, widget: string }
              - { name: messageLabel, label: Message label, widget: string }
              - { name: messagePlaceholder, label: Message placeholder, widget: string }
              - { name: submitLabel, label: Submit button, widget: string }
              - { name: submittingLabel, label: Submitting button, widget: string }
          - name: responseTime
            label: Response-time block
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: note, label: Note, widget: string }
          - { name: listenHeading, label: '"Listen on" heading', widget: string }
          - { name: followHeading, label: '"Follow" heading', widget: string }
          - name: followLinks
            label: Follow link labels
            widget: object
            fields:
              - { name: linkedinPersonal, label: LinkedIn (personal) label, widget: string }
              - { name: linkedinCompany, label: LinkedIn (company) label, widget: string }
              - { name: substack, label: Substack label, widget: string }
          - name: consulting
            label: Consulting block
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: linkText, label: Link text, widget: string }
              - { name: linkUrl, label: Link URL, widget: string }

      - name: work-with-us
        label: Work With Us page
        file: src/data/site/work-with-us.json
        format: json
        description: >-
          All text on the Work With Us page — the podcast partnerships section
          and the consulting section. Body fields support basic formatting
          (bold, italic, links).
        fields:
          - name: meta
            label: SEO / browser tab
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: description, label: Meta description, widget: text }
          - name: partnerships
            label: Podcast partnerships section
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: intro, label: Intro paragraph, widget: markdown }
              - name: stats
                label: Audience stats
                widget: list
                max: 2
                fields:
                  - { name: value, label: 'Value (e.g. 60+)', widget: string }
                  - { name: label, label: Label, widget: string }
              - { name: audienceLabel, label: '"Core audience" label', widget: string }
              - name: audienceTypes
                label: Audience type pills
                widget: list
                field: { name: type, label: Type, widget: string }
              - name: primaryCta
                label: Primary call-to-action
                widget: object
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button link, widget: string }
                  - { name: note, label: Note under button, widget: string }
              - { name: optionsHeading, label: '"How to get involved" heading', widget: string }
              - name: optionGroups
                label: Option groups
                widget: list
                summary: '{{fields.group}}'
                fields:
                  - { name: group, label: Group heading, widget: string }
                  - name: options
                    label: Options
                    widget: list
                    summary: '{{fields.title}}'
                    fields:
                      - { name: title, label: Title, widget: string }
                      - { name: description, label: Description, widget: markdown }
              - { name: closingBody, label: Closing paragraph, widget: markdown }
              - name: closingCta
                label: Closing call-to-action
                widget: object
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button link, widget: string }
          - name: photos
            label: Photo strip
            widget: list
            max: 2
            fields:
              - { name: src, label: Image, widget: image, choose_url: true }
              - { name: alt, label: Alt text, widget: string }
              - { name: position, label: 'Focus point (e.g. center 25%)', widget: string }
          - { name: consultingLabel, label: Consulting divider label, widget: string }
          - name: consulting
            label: Consulting section
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: markdown }
              - { name: whoLabel, label: '"Who Shubs works with" label', widget: string }
              - name: who
                label: Who Shubs works with
                widget: list
                field: { name: item, label: Item, widget: string }
              - { name: trustNote, label: Trust note, widget: string }
              - name: cta
                label: Call-to-action
                widget: object
                fields:
                  - { name: text, label: Button text, widget: string }
                  - { name: url, label: Button link, widget: string }

      - name: resources
        label: Resources page
        file: src/data/site/resources.json
        format: json
        description: >-
          The Resources page — hero, Shubstack callout, and every resource
          category and link. Descriptions support basic formatting (bold,
          italic, links).
        fields:
          - name: meta
            label: SEO / browser tab
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: description, label: Meta description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: intro, label: Intro paragraph, widget: markdown }
          - name: shubstack
            label: Shubstack callout
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: body, label: Body, widget: text }
              - { name: ctaText, label: Button text, widget: string }
              - { name: url, label: Substack URL, widget: string }
          - { name: jumpToLabel, label: '"Jump to" label', widget: string }
          - name: navLabels
            label: Quick-nav short labels
            widget: object
            fields:
              - { name: articles, label: Articles, widget: string }
              - { name: policy, label: Policy, widget: string }
              - { name: reading, label: Reading, widget: string }
              - { name: organisations, label: Organisations, widget: string }
              - { name: funding, label: Funding, widget: string }
          - { name: footerNote, label: Footer note, widget: markdown }
          - name: categories
            label: Resource categories
            widget: list
            summary: '{{fields.title}}'
            fields:
              - { name: id, label: 'ID (anchor, no spaces)', widget: string }
              - { name: title, label: Category title, widget: string }
              - name: items
                label: Items
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: description, label: Description, widget: markdown }
                  - { name: url, label: Link URL, widget: string, required: false }
                  - { name: subgroup, label: Subgroup heading, widget: string, required: false }

      - name: home
        label: Home page
        file: src/data/site/home.json
        format: json
        description: >-
          The home page. Text, images and links are editable here; card colours
          and persona icons are fixed in the design. The header globe's location
          pins are edited under "Homepage globe pins".
        fields:
          - name: meta
            label: SEO / browser tab
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: description, label: Meta description, widget: text }
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: text }
              - name: primaryCta
                label: Primary button
                widget: object
                fields:
                  - { name: text, label: Text, widget: string }
                  - { name: href, label: Link, widget: string }
              - name: secondaryCta
                label: Secondary link
                widget: object
                fields:
                  - { name: text, label: Text, widget: string }
                  - { name: href, label: Link, widget: string }
          - name: about
            label: About the show
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: text }
              - { name: body1, label: First paragraph, widget: markdown }
              - { name: body2, label: Second paragraph, widget: markdown }
              - { name: trailerLabel, label: Trailer label, widget: string }
          - name: showCards
            label: Three question cards
            widget: list
            max: 3
            summary: '{{fields.eyebrow}}'
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: text, label: Question, widget: text }
          - name: promo
            label: Promo photo strip
            widget: object
            fields:
              - { name: image, label: Image, widget: image, choose_url: true }
              - { name: alt, label: Alt text, widget: string }
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: quote, label: Quote, widget: text }
              - { name: attribution, label: Attribution, widget: string }
          - name: whoListens
            label: Who listens
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - name: personas
                label: Personas
                widget: list
                max: 4
                summary: '{{fields.label}}'
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: description, label: Description, widget: string }
                  - name: tags
                    label: Tags
                    widget: list
                    field: { name: tag, label: Tag, widget: string }
          - name: testimonials
            label: Testimonials
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - name: quotes
                label: Quotes
                widget: list
                field: { name: quote, label: Quote, widget: text }
          - name: orgMarquee
            label: Organisations marquee
            widget: object
            fields:
              - { name: label, label: Label, widget: string }
          - name: latestEpisodes
            label: Latest episodes heading
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: linkText, label: Link text, widget: string }
          - name: featuredVideos
            label: Featured videos heading
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: linkText, label: Link text, widget: string }
          - name: finalCta
            label: Final call-to-action
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: body, label: Body, widget: string }
              - { name: buttonText, label: Button text, widget: string }
              - { name: buttonHref, label: Button link, widget: string }

      - name: globe
        label: Homepage globe
        file: src/data/site/globe.json
        format: json
        description: >-
          The homepage globes. "Globe pins" are the location pins on the rotating
          header globe — add one for each new region the podcast covers. "Insights
          in Motion captions" are the scrolling text on the second globe lower down
          the page; you can edit that wording, but its route and animation are
          fixed in the design.
        fields:
          - name: pins
            label: Globe pins (header globe)
            label_singular: Globe pin
            widget: list
            summary: '{{fields.name}} — {{fields.label}}'
            hint: >-
              Each pin should point to a real episode or video. To find a place's
              coordinates: search it on Google Maps, right-click the spot, and the
              first number is the latitude, the second is the longitude.
            fields:
              - { name: name, label: Place name, widget: string, hint: 'Shown on the pin card, e.g. "Kenya"' }
              - { name: label, label: Topic / story, widget: string, hint: 'Short caption under the name, e.g. "Community health at scale"' }
              - { name: lat, label: Latitude, widget: number, value_type: float, step: 0.01, hint: 'Decimal degrees. North is positive, south is negative.' }
              - { name: lon, label: Longitude, widget: number, value_type: float, step: 0.01, hint: 'Decimal degrees. East is positive, west is negative.' }
              - { name: note, label: Source episode (internal note), widget: string, required: false, hint: 'Not shown on the site — records which episode/video this pin represents.' }
          - name: journey
            label: Insights in Motion captions (scrolling globe)
            widget: object
            description: >-
              The scrolling text on the second globe. You can edit the wording.
              The order and the places the globe flies between are fixed in the
              design, so keep each route heading matching its leg.
            fields:
              - { name: intro, label: Intro line (before scrolling), widget: text }
              - name: legs
                label: Journey legs
                label_singular: Journey leg
                widget: list
                min: 6
                max: 6
                summary: '{{fields.route}}'
                hint: >-
                  Six fixed legs, in order. Edit the heading and caption text only —
                  do not add or remove legs (the globe animation has exactly six).
                fields:
                  - { name: route, label: Route heading, widget: string, hint: 'e.g. "London to Nairobi" — shown as the large heading.' }
                  - { name: caption, label: Caption, widget: text }

      - name: reusable
        label: Reusable copy
        file: src/data/site/reusable.json
        format: json
        description: >-
          Shared blocks that appear on several pages — the email signup band,
          the subscribe pop-up, the host intro strip and bio pop-up, the
          consulting footer strip, and the trailer video.
        fields:
          - name: emailSignup
            label: Email signup band
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: placeholder, label: Input placeholder, widget: string }
              - { name: submitLabel, label: Button label, widget: string }
              - { name: submittingLabel, label: Button label (sending), widget: string }
              - { name: note, label: Small print, widget: string }
              - name: success
                label: Success message
                widget: object
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: body, label: Body, widget: text }
          - name: subscribeModal
            label: Subscribe pop-up
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: heading, label: Heading, widget: string }
              - { name: placeholder, label: Input placeholder, widget: string }
              - { name: submitLabel, label: Button label, widget: string }
              - { name: submittingLabel, label: Button label (sending), widget: string }
